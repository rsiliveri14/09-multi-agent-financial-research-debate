name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: debate
          POSTGRES_PASSWORD: debate
          POSTGRES_DB: debate
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U debate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6389:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PYTHONPATH: .:src
      DATABASE_URL: postgresql+asyncpg://debate:debate@localhost:5439/debate
      DATABASE_URL_SYNC: postgresql://debate:debate@localhost:5439/debate
      REDIS_URL: redis://localhost:6389/0
      STORE_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests evaluation scripts
      - name: Typecheck
        run: mypy src
      - name: Unit + regression tests
        run: pytest -q --ignore=tests/integration
      - name: Migrate
        run: alembic upgrade head
      - name: Integration
        run: INTEGRATION=1 pytest -q tests/integration
      - name: Regression evaluation
        run: python -m evaluation.runners.harness --suite regression --out evaluation/reports/regression.json
      - name: Weekly full evaluation
        if: github.event_name == 'schedule'
        run: python -m evaluation.runners.harness --suite full --out evaluation/reports/latest.json
      - name: pip-audit
        run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t debate-api:ci .
      - name: Build web image
        run: docker build -t debate-web:ci ./frontend
