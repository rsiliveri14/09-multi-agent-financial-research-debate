apiVersion: apps/v1
kind: Deployment
metadata:
  name: debate-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debate-postgres
  template:
    metadata:
      labels:
        app: debate-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - name: POSTGRES_USER
              value: debate
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: debate-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: debate
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: debate-postgres
spec:
  selector:
    app: debate-postgres
  ports:
    - port: 5432
      targetPort: 5432
