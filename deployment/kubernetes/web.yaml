apiVersion: apps/v1
kind: Deployment
metadata:
  name: debate-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debate-web
  template:
    metadata:
      labels:
        app: debate-web
    spec:
      containers:
        - name: web
          image: debate-web:local
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: debate-web
spec:
  selector:
    app: debate-web
  ports:
    - port: 80
      targetPort: 80
