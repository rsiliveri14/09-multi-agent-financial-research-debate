services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: debate
      POSTGRES_PASSWORD: debate
      POSTGRES_DB: debate
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debate"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://debate:debate@db:5432/debate
      DATABASE_URL_SYNC: postgresql://debate:debate@db:5432/debate
      REDIS_URL: redis://redis:6379/0
      STORE_BACKEND: postgres
      LLM_PROVIDER: heuristic
      CORS_ORIGINS: http://localhost:8090,http://localhost:5179
      API_PORT: 8000
    ports:
      - "${API_HOST_PORT:-8009}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8090:80"
    depends_on:
      - api

volumes:
  postgres-data:
