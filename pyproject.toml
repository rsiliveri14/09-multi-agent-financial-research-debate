[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-financial-research-debate"
version = "0.1.0"
description = "Evidence-driven multi-agent financial research debate with specialist disagreement, critic, and synthesis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Financial Research Debate" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.10",
  "alembic>=1.14.0",
  "redis>=5.2.0",
  "httpx>=0.27.0",
  "langgraph>=0.2.50",
  "numpy>=2.1.0",
  "structlog>=24.4.0",
  "orjson>=3.10.0",
  "prometheus-client>=0.21.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
  "tenacity>=9.0.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "httpx>=0.27.0",
  "testcontainers[postgres,redis]>=4.8.0",
  "locust>=2.32.0",
  "pip-audit>=2.7.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  "integration: requires postgres/redis",
  "evaluation: evaluation harness tests",
  "regression: small CI regression suite",
  "live: in-process live debates against the real corpus",
  "live_http: requires a running API on LIVE_API_URL",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts", "evaluation"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008", "N818", "UP047", "E501", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]
"alembic/**" = ["E501"]
"scripts/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
pretty = true
files = ["src"]
warn_unused_ignores = true
check_untyped_defs = true

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/evaluation/*"]
